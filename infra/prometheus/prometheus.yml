global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Each Spring Boot service exposes /actuator/prometheus.
# host.docker.internal lets Prometheus (in a container) scrape apps
# running on the host during local development.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: wayfare-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:8080"   # api-gateway
          - "host.docker.internal:8081"   # auth-service
          - "host.docker.internal:8082"   # user-service
          - "host.docker.internal:8083"   # catalog-service
          - "host.docker.internal:8084"   # trip-service
          - "host.docker.internal:8085"   # itinerary-ai-service
          - "host.docker.internal:8086"   # recommendation-service
