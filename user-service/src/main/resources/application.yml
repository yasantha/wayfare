spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/user_db
    username: ${POSTGRES_USER:wayfare}
    password: ${POSTGRES_PASSWORD:wayfare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:19092}
    consumer:
      group-id: user-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true    # trace context propagated over Kafka headers (design §9.1)
    listener:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Verifies RS256 tokens via Auth Service's JWKS (fetched lazily)
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 8082

# Outbox poller (platform-commons OutboxPoller, design §3.3)
wayfare:
  outbox:
    poll-interval-ms: 500
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
