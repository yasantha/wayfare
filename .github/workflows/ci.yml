name: CI

on:
  push:
    branches: [main]
  pull_request:

# Monorepo reactor. Each service builds with its dependency (platform-commons)
# via `-pl <service> -am`, giving per-service pipelines that still resolve
# the shared library. Independent pipelines, one repo.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - platform-commons
          - api-gateway
          - auth-service
          - user-service
          - catalog-service
          - trip-service
          - itinerary-ai-service
          - recommendation-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build & test ${{ matrix.service }}
        run: mvn -B -ntp -pl ${{ matrix.service }} -am verify
