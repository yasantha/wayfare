spring:
  application:
    name: recommendation-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/reco_db
    username: ${POSTGRES_USER:wayfare}
    password: ${POSTGRES_PASSWORD:wayfare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:19092}
    consumer:
      group-id: recommendation-service
    template:
      observation-enabled: true    # trace context propagated over Kafka headers (design §9.1)
    listener:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 8086

# Sync call to Catalog for scoring candidates (design §3.1 — the one sync dep)
wayfare:
  catalog:
    base-url: ${CATALOG_URI:http://localhost:8083}
  outbox:
    # This service only consumes events (user.preferences.updated, trip.created)
    # and produces none — reco_db has no outbox table, so platform-commons'
    # OutboxPoller must not activate here (it otherwise would: spring-kafka on
    # the classpath auto-configures a KafkaTemplate bean regardless of whether
    # anything is ever produced).
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
