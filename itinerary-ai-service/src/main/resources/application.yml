spring:
  application:
    name: itinerary-ai-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/itinerary_ai_db
    username: ${POSTGRES_USER:wayfare}
    password: ${POSTGRES_PASSWORD:wayfare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:19092}
    consumer:
      group-id: itinerary-ai-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true    # trace context propagated over Kafka headers (design §9.1)
    listener:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 8085

# Provider-agnostic LLM config — DEMO_MODE serves fixtures (no spend).
llm:
  demo-mode: ${DEMO_MODE:true}
  provider: ${LLM_PROVIDER:groq}
  read-timeout: 60s
  groq:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1}

quota:
  per-user-per-day: ${GEN_QUOTA_PER_USER_PER_DAY:3}
  global-per-day: ${GEN_QUOTA_GLOBAL_PER_DAY:20}

# Internal sync calls (design §3.1) — grounding + saga status update
wayfare:
  catalog:
    base-url: ${CATALOG_URI:http://localhost:8083}
  user:
    base-url: ${USER_URI:http://localhost:8082}
  trip:
    base-url: ${TRIP_URI:http://localhost:8084}
  outbox:
    poll-interval-ms: 500
    batch-size: 100

# Resilience4j (design §7.6): timeout/retry/circuit-breaker around every LLM call
resilience4j:
  retry:
    instances:
      llm:
        max-attempts: 2
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.wayfare.commons.error.Exceptions$ExternalServiceException
  circuitbreaker:
    instances:
      llm:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
